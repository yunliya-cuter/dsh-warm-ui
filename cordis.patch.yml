# dsh-warm-ui bundle 层：把暖色系列的全部插件插进组合树。
#
# 本包是一个**单包多插件**的 bundle：根目录的 `lib/` 是暖色主题本体，
# `preview/shared|wallpaper|brandgag/` 是同一仓库里的三个子包。它们随 npm
# 包一起发布，并通过下面的相对路径 entry 装进同一个 profile —— 所以安装
# `dsh-warm-ui` 一条 spec 就能得到完整暖色系列，不再需要分别安装子包。
#
# 为什么 entry 用相对路径而不是包名：子包不是独立 npm 依赖（pnpm 默认禁止
# git 子依赖，ERR_PNPM_EXOTIC_SUBDEP），但它们的 package.json 就躺在
# `node_modules/dsh-warm-ui/preview/*` 里；DSH 的 loader 接受文件路径 entry，
# 并按最近的 package.json 读取各自的 dsh.client 声明。
- insert:
    - id: dsh-warm-shared
      name: './preview/shared/lib/index.js'
      config: {}
    - id: dsh-warm-ui
      name: 'dsh-warm-ui'
      config: {}
    - id: dsh-warm-brandgag
      name: './preview/brandgag/lib/index.js'
      config: {}
    - id: dsh-warm-wallpaper
      name: './preview/wallpaper/lib/index.js'
      config: {}
